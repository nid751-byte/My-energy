name: Build My Energy APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'

      - name: Unzip Android source
        run: unzip -o my_energy_android_source.zip -d project

      - name: Generate Android project and build APK
        run: |
          cd project/my_energy_android_source
          flutter create --platforms=android .
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-energy-apk
          path: project/my_energy_android_source/build/app/outputs/flutter-apk/app-release.apk
