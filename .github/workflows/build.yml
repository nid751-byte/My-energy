name: Build My Energy APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'

      - name: Unzip project
        run: |
          unzip -o my_energy_android_source.zip -d project

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release
